workflows:
  android-workflow:
    name: Watch & Earn — Android Build
    max_build_duration: 30
    environment:
      flutter: stable
      android_signing:
        - keystore_reference   # প্রথমবার Codemagic-এ কী-স্টোর সেটআপ করলে এই রেফারেন্স বসবে
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build APK (debug/test build)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com   # 🔴 নিজের ইমেইল দিন — বিল্ড শেষ হলে APK লিংক ইমেইলে আসবে
